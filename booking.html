<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Your Tour - STEMA TRANS</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f5f5f5;
}

header{
background:#b30d24;
color:white;
padding:25px;
text-align:center;
}

.booking{
max-width:700px;
margin:30px auto;
background:white;
padding:25px;
border-radius:12px;
box-shadow:0 4px 12px rgba(0,0,0,.1);
}

.booking h2{
text-align:center;
color:#b30d24;
margin-bottom:10px;
}

.booking p{
text-align:center;
margin-bottom:20px;
}

.booking input,
.booking select,
.booking textarea{
width:100%;
padding:14px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

.booking textarea{
height:120px;
resize:vertical;
}

button{
width:100%;
background:#b30d24;
color:white;
padding:16px;
font-size:18px;
border:none;
border-radius:8px;
cursor:pointer;
}

button:hover{
background:#8d091c;
}
nav{
    background:#222;
    text-align:center;
    padding:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
    font-size:16px;
}

nav a:hover{
    color:#d4af37;
}
footer{
margin-top:40px;
background:#222;
color:white;
text-align:center;
padding:20px;
}
</style>

</head>

<body>

<header>
<h1>STEMA TRANS</h1>
<p>Professional Nairobi City Tours & Airport Transfers</p>
</header>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="booking.html">Book Now</a>
    <a href="contact.html">Contact</a>
</nav>

<section class="booking">

<h2>Book Your Tour</h2>

<p>Fill in the details below and we will contact you shortly.</p>

<form action="https://formsubmit.co/stemawastrans@gmail.com" method="POST">

<input type="hidden" name="_next" value="https://themaina1.github.io/Stema-Trans-City-tours/thankyou.html">

<input type="hidden" name="_captcha" value="false">

<input type="text" name="Name" placeholder="Full Name" required>

<input type="tel" name="Phone" placeholder="Phone Number" required>

<input type="email" name="Email" placeholder="Email Address">

<select name="Service" required>
<option value="">Select Service</option>
<option>Nairobi City Tour</option>
<option>Airport Transfer</option>
<option>Hotel Transfer</option>
<option>Giraffe Centre Tour</option>
<option>Karen Blixen Tour</option>
<option>Private Hire</option>
</select>

<select name="Vehicle">
<option value="">Preferred Vehicle</option>
<option>Tour Van</option>
<option>Land Cruiser</option>
<option>Executive Sedan</option>
</select>

<input type="date" name="Date">

<input type="time" name="Time">

<input type="number" name="Passengers" placeholder="Number of Passengers">

<input type="text" name="Pickup" placeholder="Pickup Location">

<input type="text" name="Destination" placeholder="Destination">

<textarea name="Message" placeholder="Special Requests"></textarea>

<button type="submit">Submit Booking</button>

</form>

</section>

<footer>

<p>© 2026 STEMA TRANS</p>

<p>Nairobi, Kenya</fp>

</footer>
<script>
const params = new URLSearchParams(window.location.search);
const vehicle = params.get("vehicle");

if (vehicle) {
    const select = document.querySelector('select[name="Vehicle"]');
    if (select) {
        select.value = decodeURIComponent(vehicle);
    }
}
</script>
</body>
</html>
