<section class="cta">

<h2>Book Your Tour or Transfer</h2>

<p>Please complete the form below and we will contact you shortly.</p>

<form class="booking-form">

<input type="text" placeholder="Full Name" required>

<input type="tel" placeholder="Phone Number" required>

<input type="email" placeholder="Email Address">

<select required>
<option value="">Select Service</option>
<option>Nairobi City Tour</option>
<option>Airport Transfer</option>
<option>Hotel Transfer</option>
<option>Giraffe Centre Tour</option>
<option>Karen Blixen Tour</option>
<option>Nairobi National Park</option>
<option>Private Hire</option>
</select>

<select>
<option>Preferred Vehicle</option>
<option>Tour Land Cruiser</option>
<option>Tour Van</option>
</select>

<input type="date">

<input type="number" placeholder="Number of Guests">

<textarea rows="6" placeholder="Special Requests"></textarea>

<button class="btn" type="submit">
Submit Booking
</button>

</form>

</section>
